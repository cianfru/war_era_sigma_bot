[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# Migrations run once per deploy (not per container restart).
preDeployCommand = "alembic upgrade head"
# Intentionally no startCommand: the Dockerfile CMD wraps the start in `sh -c`
# so ${PORT:-8000} is expanded by the shell. When startCommand is set on this
# Railway plan, $PORT is passed literally to uvicorn and the container loops.
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
